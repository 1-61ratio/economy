<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12161d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Финансы">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Учёт финансов — zł / грн</title>
<style>
  :root{
    --bg: #12161d;
    --surface: #1a2029;
    --surface-2: #212836;
    --line: #2a3140;
    --text: #eef1f5;
    --text-dim: #8b94a5;
    --gold: #e3b34d;
    --green: #74c39a;
    --red: #e07a6f;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 20px 14px 60px;
    overflow-x: hidden;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  .wrap{ max-width: 560px; margin: 0 auto; }

  header{ margin-bottom: 20px; }
  header .eyebrow{ font-size: 13px; color: var(--gold); letter-spacing: 0.02em; margin-bottom: 4px; }
  header h1{ font-size: 26px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p{ font-size: 14px; color: var(--text-dim); margin: 0; line-height: 1.5; }

  .view-tabs{
    display:flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 3px;
    margin-bottom: 18px;
  }
  .view-tabs button{
    flex:1;
    border:none;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 0;
    border-radius: 9px;
    cursor:pointer;
  }
  .view-tabs button.active{ background: var(--surface-2); color: var(--gold); }

  .rate-bar{
    display:flex; align-items:center; gap:10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    margin: 18px 0;
    font-size: 13px;
  }
  .rate-bar span.label{ color: var(--text-dim); white-space:nowrap; }
  .rate-bar input{
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--gold);
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    width: 64px;
    padding: 2px 4px;
  }
  .rate-bar input:focus{ outline:none; border-bottom-color: var(--gold); }
  .rate-bar .hint{ margin-left:auto; color: var(--text-dim); font-size:12px; }

  .rate-bar .rate-mode{
    display:flex; gap:4px; background: var(--surface-2); border-radius:8px; padding:2px; margin-right:2px;
  }
  .rate-bar .rate-mode button{
    border:none; background:transparent; color: var(--text-dim);
    font-family: var(--sans); font-size: 11px; font-weight:600;
    padding: 5px 8px; border-radius:6px; cursor:pointer;
  }
  .rate-bar .rate-mode button.active{ background: var(--surface); color: var(--gold); }
  .rate-bar input:disabled{ color: var(--text-dim); border-bottom-color: transparent; }
  .rate-bar .refresh{
    border:none; background:transparent; color: var(--gold);
    font-size: 15px; cursor:pointer; padding: 2px 4px; line-height:1;
  }
  .rate-bar .refresh.spinning{ animation: spin 0.8s linear infinite; }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .rate-updated{ font-size: 11px; color: var(--text-dim); margin: -12px 0 18px 2px; }

  .summary{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .summary .cell{
    background: var(--surface);
    padding: 16px 14px;
    min-width: 0;
  }
  .summary .cell .k{ font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .summary .cell .v{
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    line-height:1.25;
    word-break: break-all;
    overflow-wrap: anywhere;
  }
  .summary .cell .v2{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
    word-break: break-all;
    overflow-wrap: anywhere;
  }
  .summary .income .v{ color: var(--green); }
  .summary .expense .v{ color: var(--red); }
  .summary .balance .v{ color: var(--gold); }

  form.add{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 26px;
  }
  .seg{
    display:flex;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 12px;
  }
  .seg button{
    flex:1;
    border:none;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 0;
    border-radius: 8px;
    cursor:pointer;
    transition: background .15s, color .15s;
  }
  .seg button.active.income{ background: rgba(116,195,154,0.16); color: var(--green); }
  .seg button.active.expense{ background: rgba(224,122,111,0.16); color: var(--red); }

  .row{ display:flex; gap:10px; margin-bottom:10px; }
  .field{ flex:1; }
  .field label{ display:block; font-size: 11px; color: var(--text-dim); margin-bottom: 5px; }
  .field input, .field select{
    width:100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 9px 10px;
  }
  .field input:focus, .field select:focus{ outline:none; border-color: var(--gold); }
  .field.amount input{ font-family: var(--mono); font-weight:600; }

  .submit{
    width:100%;
    border:none;
    border-radius: 9px;
    padding: 11px 0;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: var(--gold);
    color: #1a1305;
    margin-top: 4px;
    transition: filter .15s;
  }
  .submit:hover{ filter: brightness(1.08); }
  .submit:disabled{ opacity:.4; cursor:not-allowed; }

  .month-group{ margin-bottom: 22px; }
  .month-head{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 2px 8px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }
  .month-head .title{ font-size: 14px; font-weight: 600; text-transform: capitalize; }
  .month-head .sums{ font-family: var(--mono); font-size: 12px; color: var(--text-dim); text-align:right; }
  .month-head .sums b.pos{ color: var(--green); }
  .month-head .sums b.neg{ color: var(--red); }

  .tx{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 10px 2px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .tx:last-child{ border-bottom:none; }
  .tx .dot{
    width: 7px; height:7px; border-radius: 50%; flex-shrink:0;
  }
  .tx.income .dot{ background: var(--green); }
  .tx.expense .dot{ background: var(--red); }
  .tx .meta{ flex:1; min-width:0; }
  .tx .cat{ font-size: 13.5px; font-weight: 500; }
  .tx .note{ font-size: 12px; color: var(--text-dim); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx .date{ font-size: 11px; color: var(--text-dim); flex-shrink:0; width: 40px; }
  .tx .amt{ font-family: var(--mono); font-size: 14px; font-weight:600; text-align:right; flex-shrink:0; min-width: 80px; max-width: 130px; word-break: break-all; }
  .tx.income .amt{ color: var(--green); }
  .tx.expense .amt{ color: var(--red); }
  .tx .amt .sub{ display:block; font-size: 10.5px; color: var(--text-dim); font-weight: 400; }
  .tx .del{
    background:none; border:none; color: var(--text-dim); font-size: 16px;
    cursor:pointer; padding: 2px 4px; flex-shrink:0; line-height:1;
  }
  .tx .del:hover{ color: var(--red); }

  .period-bar{
    display:flex;
    gap: 6px;
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .period-bar button{
    flex-shrink:0;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    cursor:pointer;
  }
  .period-bar button.active{ background: var(--gold); color:#1a1305; border-color: var(--gold); }

  .stats-section{ margin-bottom: 26px; }
  .stats-section h2{ font-size: 14px; font-weight: 600; margin: 0 0 12px; }

  .cat-list{ display:flex; flex-direction:column; gap:12px; }
  .cat-row .cat-top{ display:flex; justify-content:space-between; font-size: 13px; margin-bottom: 5px; }
  .cat-row .cat-top .name{ font-weight:500; }
  .cat-row .cat-top .amt{ font-family: var(--mono); color: var(--text-dim); }
  .cat-row .bar-track{ height: 7px; background: var(--surface-2); border-radius: 999px; overflow:hidden; }
  .cat-row .bar-fill{ height:100%; border-radius: 999px; }
  .cat-row.expense .bar-fill{ background: var(--red); }
  .cat-row.income .bar-fill{ background: var(--green); }
  .cat-row .cat-sub{ font-family: var(--mono); font-size:11px; color: var(--text-dim); margin-top: 3px; }

  .trend-list{ display:flex; flex-direction:column; }
  .trend-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 2px; border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 13px;
  }
  .trend-row:last-child{ border-bottom:none; }
  .trend-row .m{ text-transform:capitalize; }
  .trend-row .nums{ font-family: var(--mono); font-size:12px; text-align:right; color: var(--text-dim); }
  .trend-row .nums b.pos{ color: var(--green); }
  .trend-row .nums b.neg{ color: var(--red); }

  .empty{
    text-align:center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 30px 10px;
    border: 1px dashed var(--line);
    border-radius: 12px;
  }

  .loading{ text-align:center; color: var(--text-dim); padding: 40px 0; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading" id="loading">Загрузка данных…</div>
</div>

<script>
const CATS_EXPENSE = ['Жильё','Еда','Транспорт','Связь/интернет','Здоровье','Одежда','Развлечения','Прочее'];
const CATS_INCOME = ['Зарплата','Подработка','Перевод','Прочее'];

let state = {
  rate: 10.0,      // 1 PLN = X UAH
  rateMode: 'auto', // 'auto' | 'manual'
  rateUpdatedAt: null, // ISO string of last successful auto-fetch
  txs: [],         // {id, type, amount, category, note, date}
  type: 'expense',
  loaded: false,
  view: 'diary',   // 'diary' | 'stats'
  period: 'month', // 'month' | '3m' | '6m' | 'year' | 'all'
  rateFetching: false,
  rateError: false
};

const PERIODS = [
  { key: 'month', label: 'Месяц' },
  { key: '3m', label: '3 мес' },
  { key: '6m', label: '6 мес' },
  { key: 'year', label: 'Год' },
  { key: 'all', label: 'Всё время' }
];

function periodStart(period){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), 1);
  if(period === 'month') return d;
  if(period === '3m'){ d.setMonth(d.getMonth() - 2); return d; }
  if(period === '6m'){ d.setMonth(d.getMonth() - 5); return d; }
  if(period === 'year'){ d.setMonth(d.getMonth() - 11); return d; }
  return null; // 'all'
}

function periodLabel(period){
  return PERIODS.find(p => p.key === period)?.label ?? '';
}

function catBreakdown(list, type){
  const map = {};
  list.filter(t => t.type === type).forEach(t=>{
    map[t.category] = (map[t.category] || 0) + t.amount;
  });
  const total = Object.values(map).reduce((a,b)=>a+b, 0);
  return Object.entries(map)
    .map(([category, amount]) => ({ category, amount, pct: total ? (amount/total*100) : 0 }))
    .sort((a,b)=> b.amount - a.amount);
}

function fmt(n){
  return new Intl.NumberFormat('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2}).format(n);
}

function monthKey(dateStr){
  const d = new Date(dateStr);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  return d.toLocaleDateString('ru-RU', {month:'long', year:'numeric'});
}
function shortDate(dateStr){
  const d = new Date(dateStr);
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0');
}

async function loadState(){
  try{
    const raw = localStorage.getItem('finance-state');
    if(raw){
      const parsed = JSON.parse(raw);
      state.rate = parsed.rate ?? 10.0;
      state.rateMode = parsed.rateMode ?? 'auto';
      state.rateUpdatedAt = parsed.rateUpdatedAt ?? null;
      state.txs = parsed.txs ?? [];
    }
  }catch(e){
    // no saved state yet
  }
  state.loaded = true;
  render();
  if(state.rateMode === 'auto') fetchRate(false);
}

async function saveState(){
  try{
    localStorage.setItem('finance-state', JSON.stringify({
      rate: state.rate, rateMode: state.rateMode, rateUpdatedAt: state.rateUpdatedAt, txs: state.txs
    }));
  }catch(e){
    console.error('Не удалось сохранить данные', e);
  }
}

function hoursSince(iso){
  if(!iso) return Infinity;
  return (Date.now() - new Date(iso).getTime()) / (1000*60*60);
}

async function fetchRate(force){
  if(state.rateFetching) return;
  if(!force && hoursSince(state.rateUpdatedAt) < 24) return; // не чаще раза в сутки
  state.rateFetching = true;
  state.rateError = false;
  render();
  let uah = null;
  try{
    const r = await fetch('https://open.er-api.com/v6/latest/PLN');
    const data = await r.json();
    if(data && data.rates && data.rates.UAH) uah = data.rates.UAH;
  }catch(e){ /* попробуем запасной источник */ }

  if(!uah){
    try{
      const r2 = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/pln.json');
      const data2 = await r2.json();
      if(data2 && data2.pln && data2.pln.uah) uah = data2.pln.uah;
    }catch(e){ /* оба источника недоступны */ }
  }

  if(uah){
    state.rate = uah;
    state.rateUpdatedAt = new Date().toISOString();
  } else {
    state.rateError = true;
  }
  state.rateFetching = false;
  saveState();
  render();
}

function setRateMode(mode){
  state.rateMode = mode;
  if(mode === 'auto') fetchRate(true);
  else { saveState(); render(); }
}

function updatedLabel(){
  if(!state.rateUpdatedAt) return 'ещё не обновлялся';
  const h = hoursSince(state.rateUpdatedAt);
  if(h < 1) return 'обновлён только что';
  if(h < 24) return `обновлён сегодня, ${new Date(state.rateUpdatedAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}`;
  return `обновлён ${Math.floor(h/24)} дн. назад`;
}

function addTx(tx){
  state.txs.push(tx);
  state.txs.sort((a,b)=> new Date(b.date) - new Date(a.date));
  saveState();
  render();
}

function deleteTx(id){
  state.txs = state.txs.filter(t => t.id !== id);
  saveState();
  render();
}

function setRate(v){
  const n = parseFloat(v);
  if(!isNaN(n) && n > 0){
    state.rate = n;
    saveState();
    render();
  }
}

function totals(list){
  let income=0, expense=0;
  list.forEach(t => t.type==='income' ? income+=t.amount : expense+=t.amount);
  return {income, expense, balance: income-expense};
}

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){ app.innerHTML = '<div class="loading">Загрузка данных…</div>'; return; }

  app.innerHTML = `
    <header>
      <div class="eyebrow">PLN → UAH</div>
      <h1>Учёт финансов</h1>
      <p>Заносишь доходы и расходы в злотых — сумма пересчитывается в гривны по текущему курсу и складывается по месяцам.</p>
    </header>

    <div class="view-tabs">
      <button type="button" data-view="diary" class="${state.view==='diary'?'active':''}">Дневник</button>
      <button type="button" data-view="stats" class="${state.view==='stats'?'active':''}">Статистика</button>
    </div>

    <div id="viewBody"></div>
  `;

  document.querySelectorAll('.view-tabs button').forEach(b=>{
    b.addEventListener('click', ()=>{ state.view = b.dataset.view; render(); });
  });

  if(state.view === 'diary') renderDiary(); else renderStats();
}

function renderDiary(){
  const body = document.getElementById('viewBody');
  const t = totals(state.txs);
  const rate = state.rate;

  const groups = {};
  state.txs.forEach(tx=>{
    const k = monthKey(tx.date);
    if(!groups[k]) groups[k]=[];
    groups[k].push(tx);
  });
  const sortedMonths = Object.keys(groups).sort().reverse();

  const catOptions = (state.type === 'income' ? CATS_INCOME : CATS_EXPENSE)
    .map(c => `<option value="${c}">${c}</option>`).join('');

  body.innerHTML = `
    <div class="rate-bar">
      <div class="rate-mode">
        <button type="button" data-mode="auto" class="${state.rateMode==='auto'?'active':''}">Авто</button>
        <button type="button" data-mode="manual" class="${state.rateMode==='manual'?'active':''}">Вручную</button>
      </div>
      <span class="label">1 zł =</span>
      <input id="rateInput" type="number" step="0.01" min="0.01" value="${rate.toFixed(2)}" ${state.rateMode==='auto'?'disabled':''}>
      <span class="label">грн</span>
      ${state.rateMode==='auto' ? `<button type="button" class="refresh ${state.rateFetching?'spinning':''}" id="refreshRate" title="Обновить сейчас">⟳</button>` : ''}
    </div>
    <div class="rate-updated">
      ${state.rateMode==='auto'
        ? (state.rateError ? 'не удалось обновить курс — используется последнее известное значение' : updatedLabel())
        : 'курс задан вручную'}
    </div>

    <div class="summary">
      <div class="cell income">
        <div class="k">Доход</div>
        <div class="v">${fmt(t.income)} zł</div>
        <div class="v2">≈ ${fmt(t.income*rate)} грн</div>
      </div>
      <div class="cell expense">
        <div class="k">Расход</div>
        <div class="v">${fmt(t.expense)} zł</div>
        <div class="v2">≈ ${fmt(t.expense*rate)} грн</div>
      </div>
      <div class="cell balance">
        <div class="k">Остаток</div>
        <div class="v">${fmt(t.balance)} zł</div>
        <div class="v2">≈ ${fmt(t.balance*rate)} грн</div>
      </div>
    </div>

    <form class="add" id="addForm">
      <div class="seg">
        <button type="button" class="tab-income ${state.type==='income'?'active income':''}" data-type="income">Доход</button>
        <button type="button" class="tab-expense ${state.type==='expense'?'active expense':''}" data-type="expense">Расход</button>
      </div>
      <div class="row">
        <div class="field amount">
          <label>Сумма, zł</label>
          <input type="number" step="0.01" min="0.01" id="amountInput" placeholder="0.00" required>
        </div>
        <div class="field">
          <label>Дата</label>
          <input type="date" id="dateInput" value="${new Date().toISOString().slice(0,10)}" required>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Категория</label>
          <select id="catInput">${catOptions}</select>
        </div>
        <div class="field">
          <label>Заметка (необязательно)</label>
          <input type="text" id="noteInput" placeholder="например, Biedronka">
        </div>
      </div>
      <button type="submit" class="submit">Добавить</button>
    </form>

    <div id="history">
      ${sortedMonths.length === 0 ? '<div class="empty">Пока нет записей — добавь первую операцию выше.</div>' : sortedMonths.map(k=>{
        const list = groups[k];
        const mt = totals(list);
        return `
          <div class="month-group">
            <div class="month-head">
              <div class="title">${monthLabel(k)}</div>
              <div class="sums">
                <b class="pos">+${fmt(mt.income)}</b> / <b class="neg">−${fmt(mt.expense)}</b> zł
                <br>баланс: ${fmt(mt.balance)} zł ≈ ${fmt(mt.balance*rate)} грн
              </div>
            </div>
            ${list.map(tx => `
              <div class="tx ${tx.type}">
                <div class="dot"></div>
                <div class="date">${shortDate(tx.date)}</div>
                <div class="meta">
                  <div class="cat">${tx.category}</div>
                  ${tx.note ? `<div class="note">${escapeHtml(tx.note)}</div>` : ''}
                </div>
                <div class="amt">
                  ${tx.type==='income'?'+':'−'}${fmt(tx.amount)} zł
                  <span class="sub">≈ ${fmt(tx.amount*rate)} грн</span>
                </div>
                <button class="del" data-id="${tx.id}" title="Удалить">×</button>
              </div>
            `).join('')}
          </div>
        `;
      }).join('')}
    </div>
  `;

  document.getElementById('rateInput').addEventListener('change', e => setRate(e.target.value));
  document.querySelectorAll('.rate-mode button').forEach(b=>{
    b.addEventListener('click', ()=> setRateMode(b.dataset.mode));
  });
  const refreshBtn = document.getElementById('refreshRate');
  if(refreshBtn) refreshBtn.addEventListener('click', ()=> fetchRate(true));
  document.querySelectorAll('.seg button').forEach(b=>{
    b.addEventListener('click', ()=>{ state.type = b.dataset.type; render(); });
  });
  document.getElementById('addForm').addEventListener('submit', e=>{
    e.preventDefault();
    const amount = parseFloat(document.getElementById('amountInput').value);
    const date = document.getElementById('dateInput').value;
    const category = document.getElementById('catInput').value;
    const note = document.getElementById('noteInput').value.trim();
    if(!amount || amount <= 0 || !date) return;
    addTx({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), type: state.type, amount, category, note, date });
  });
  document.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteTx(btn.dataset.id));
  });
}

function renderStats(){
  const body = document.getElementById('viewBody');
  const rate = state.rate;
  const start = periodStart(state.period);
  const list = start ? state.txs.filter(t => new Date(t.date) >= start) : state.txs.slice();
  const t = totals(list);

  const expCats = catBreakdown(list, 'expense');
  const incCats = catBreakdown(list, 'income');
  const maxExp = expCats[0]?.amount || 1;
  const maxInc = incCats[0]?.amount || 1;

  // monthly trend within period, oldest -> newest
  const groups = {};
  list.forEach(tx=>{
    const k = monthKey(tx.date);
    if(!groups[k]) groups[k]=[];
    groups[k].push(tx);
  });
  const months = Object.keys(groups).sort();

  function catRows(cats, max, type){
    if(cats.length === 0) return '<div class="empty">Нет операций за этот период</div>';
    return `<div class="cat-list">${cats.map(c => `
      <div class="cat-row ${type}">
        <div class="cat-top">
          <span class="name">${c.category}</span>
          <span class="amt">${fmt(c.amount)} zł</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${(c.amount/max*100).toFixed(1)}%"></div></div>
        <div class="cat-sub">${c.pct.toFixed(1)}% · ≈ ${fmt(c.amount*rate)} грн</div>
      </div>
    `).join('')}</div>`;
  }

  body.innerHTML = `
    <div class="period-bar">
      ${PERIODS.map(p => `<button data-period="${p.key}" class="${state.period===p.key?'active':''}">${p.label}</button>`).join('')}
    </div>

    <div class="summary">
      <div class="cell income">
        <div class="k">Доход</div>
        <div class="v">${fmt(t.income)} zł</div>
        <div class="v2">≈ ${fmt(t.income*rate)} грн</div>
      </div>
      <div class="cell expense">
        <div class="k">Расход</div>
        <div class="v">${fmt(t.expense)} zł</div>
        <div class="v2">≈ ${fmt(t.expense*rate)} грн</div>
      </div>
      <div class="cell balance">
        <div class="k">Баланс</div>
        <div class="v">${fmt(t.balance)} zł</div>
        <div class="v2">≈ ${fmt(t.balance*rate)} грн</div>
      </div>
    </div>

    <div class="stats-section">
      <h2>Расходы по категориям · ${periodLabel(state.period)}</h2>
      ${catRows(expCats, maxExp, 'expense')}
    </div>

    <div class="stats-section">
      <h2>Доходы по категориям · ${periodLabel(state.period)}</h2>
      ${catRows(incCats, maxInc, 'income')}
    </div>

    ${months.length > 1 ? `
    <div class="stats-section">
      <h2>По месяцам</h2>
      <div class="trend-list">
        ${months.slice().reverse().map(k=>{
          const mt = totals(groups[k]);
          return `
            <div class="trend-row">
              <span class="m">${monthLabel(k)}</span>
              <span class="nums">
                <b class="pos">+${fmt(mt.income)}</b> / <b class="neg">−${fmt(mt.expense)}</b> zł
                <br>баланс ${fmt(mt.balance)} zł ≈ ${fmt(mt.balance*rate)} грн
              </span>
            </div>
          `;
        }).join('')}
      </div>
    </div>` : ''}
  `;

  document.querySelectorAll('.period-bar button').forEach(b=>{
    b.addEventListener('click', ()=>{ state.period = b.dataset.period; render(); });
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadState();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
  });
}
</script>
</body>
</html>
